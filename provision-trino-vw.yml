---
# Provision a Trino Virtual Warehouse on a CDW-capable CDP environment.
#
# Trino VW support landed in cloudera.cloud @ 5ad1809 (#307); pinned at main e7f1cea, where
# dw_cluster takes `env` + `aws: {lb_subnets, worker_subnets}`. This chains the full stack:
#   1. Activate a CDW cluster on the environment      (dw_cluster)
#   2. Create a Database Catalog inside it            (dw_database_catalog)
#   3. Create the Trino Virtual Warehouse             (dw_virtual_warehouse, type: trino)
#
# The environment must have private worker subnets (CDW/EKS cannot activate on a
# public-subnet-only env). Auth: uses the default profile in ~/.cdp/credentials (no secrets here).
# Idempotent: safe to re-run; each module reconciles to state: present.
#
# Required extra-vars (both change on every environment rebuild, so they are never hardcoded):
#   env_crn          the environment CRN
#   private_subnets  list of the env's private subnet IDs (lb + worker subnets)
#
#   ansible-playbook provision-trino-vw.yml -v \
#     -e '{"env_crn": "crn:cdp:environments:...", "private_subnets": ["subnet-a","subnet-b","subnet-c"]}'
- name: Provision Trino Virtual Warehouse
  hosts: localhost
  gather_facts: false
  vars:
    dbc_name: "srm-iceberg-dbc"
    vw_name: "srm-trino-vw"
    vw_size: "xsmall"
  pre_tasks:
    - name: Require env_crn and private_subnets
      ansible.builtin.assert:
        that:
          - env_crn is defined and env_crn | length > 0
          - private_subnets is defined and private_subnets | length > 0
        fail_msg: "pass -e env_crn=<crn> and -e private_subnets=<json list of subnet ids>"
  tasks:
    # semi-private env: activate CDW with a PRIVATE load balancer on the PRIVATE subnets.
    # A public LB (private_load_balancer: false) on a semi-private env is rejected at CDW
    # intake (Accepted -> Error at ~6 min, no reason surfaced). AWS subnets are required
    # (omitting them fails with "missing AWS activation parameters"), so lb + worker both use
    # the private subnets.
    - name: Activate CDW cluster on the environment
      cloudera.cloud.dw_cluster:
        env: "{{ env_crn }}"
        overlay: true                 # private Pod IP range — conserve VPC IPs in shared tenant
        private_load_balancer: true   # semi-private env → private LB (public LB is rejected at intake)
        public_worker_node: false     # workers on private subnets
        aws:
          lb_subnets: "{{ private_subnets }}"
          worker_subnets: "{{ private_subnets }}"
        state: present
        wait: true
        timeout: 3600
      register: dw

    - name: CDW cluster id
      ansible.builtin.debug:
        msg: "CDW cluster {{ dw.cluster.id }} ({{ dw.cluster.status | default('?') }})"

    - name: Create Database Catalog
      cloudera.cloud.dw_database_catalog:
        cluster_id: "{{ dw.cluster.id }}"
        name: "{{ dbc_name }}"
        state: present
        wait: true
        timeout: 3600
      register: dbc

    - name: Database Catalog id
      ansible.builtin.debug:
        msg: "Database Catalog {{ dbc.database_catalog.id }} ({{ dbc.database_catalog.status | default('?') }})"

    - name: Create Trino Virtual Warehouse
      cloudera.cloud.dw_virtual_warehouse:
        cluster_id: "{{ dw.cluster.id }}"
        catalog_id: "{{ dbc.database_catalog.id }}"
        name: "{{ vw_name }}"
        type: trino
        tshirt_size: "{{ vw_size }}"
        state: present
        wait: true
        timeout: 3600
      register: vw

    - name: Trino Virtual Warehouse result
      ansible.builtin.debug:
        var: vw.virtual_warehouse
